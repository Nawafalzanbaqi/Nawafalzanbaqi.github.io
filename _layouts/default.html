<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="{{ page.excerpt | strip_html | default: site.description }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    {% if site.favicon %}
      <link rel="icon" href="{{ site.favicon | relative_url }}">
    {% endif %}

    {% seo %}

    {%- comment -%}
    ضع كود Google Analytics هنا لو حاب مستقبلاً
    {%- endcomment -%}
  </head>
  <body>
    <div class="page-wrapper">
      <aside class="sidebar">
        <h2>{{ site.title }}</h2>
        <p style="font-size:0.9rem;">
          Software development.
        </p>

        <nav>
          <a href="{{ '/' | relative_url }}">🏠 Home</a>
          <a href="{{ '/about/' | relative_url }}">👤 About Me</a>
          <a href="{{ '/projects/' | relative_url }}">🧩 Projects</a>
          <a href="{{ '/daily-log/' | relative_url }}">📅 Daily Log</a>
        </nav>

        <hr>

        <div>
          <strong>Contact</strong><br>
          <a href="mailto:{{ site.email }}">{{ site.email }}</a><br>
          <a href="https://github.com/{{ site.github_username }}">GitHub</a><br>
          <a href="{{ site.linkedin_url }}" class="btn-linkedin" target="_blank">
            Connect on LinkedIn
          </a>
        </div>
      </aside>

      <main class="main-content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
