<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="{{ page.excerpt | strip_html | default: site.description }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    {% if site.favicon %}
      <link rel="icon" href="{{ site.favicon | relative_url }}">
    {% endif %}

    {% seo %}
  </head>
  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <div>
          <div class="site-title">
            <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
          </div>
          <p class="site-tagline">
            Software development student at Tuwaiq Bootcamp.
          </p>
        </div>

        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/daily-log/' | relative_url }}">Daily Log</a>
          <a href="{{ site.linkedin_url }}" class="btn-linkedin" target="_blank">LinkedIn</a>
        </nav>
      </header>

      <main class="main-content">
        {{ content }}

        <footer class="site-footer">
          <p>
            Contact:
            <a href="mailto:{{ site.email }}">{{ site.email }}</a>
            ·
            <a href="https://github.com/{{ site.github_username }}">GitHub</a>
          </p>
        </footer>
      </main>
    </div>
  </body>
</html>
